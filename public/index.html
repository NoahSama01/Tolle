<!doctype html>
<html lang="en" class="app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#df6a2e">
<meta name="description" content="Read the whole Bible by a date you choose.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Tolle</title>
<link rel="preload" href="fonts/archivo-400-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/eb-garamond.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="tokens.css">
<script>/* night mode: Off, On, or follow the phone */const theme=()=>{let t;try{t=localStorage.getItem('tolle-theme')}catch{}document.documentElement.dataset.theme=t==='dark'||t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'};theme()</script>
<style>
/* type roles: reading serif (--read), mono data at .6875 / .75 / .8125rem, caps labels at .75rem, section heads at .85rem */
:root{--read:1.1875rem;--read-lh:1.6;--lh-night:0}
html{background:var(--board);scrollbar-color:var(--ink) var(--board)}
/* the board: the current division's hue at full strength, with the fibre of a pressed divider card */
body{margin:0;overflow-x:clip;color:var(--ink);font:400 1rem/1.5 var(--sans);font-stretch:100%;-webkit-tap-highlight-color:transparent;background:var(--board) url(board-grain.png)}
h1:focus,main:focus{outline:none}
button{font:inherit;color:inherit}
.skip{position:fixed;top:-4rem;left:.75rem;z-index:20;padding:.7rem 1rem;border-radius:2px;background:var(--bar);color:var(--bar-ink);font:700 .85rem var(--head);letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
.skip:focus{top:.75rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.mono{font:500 .8125rem/1.4 var(--mono);letter-spacing:.02em;font-variant-numeric:tabular-nums}

main{max-width:30rem;margin:0 auto;padding:1rem calc(var(--rail) + 1rem) calc(var(--tab) + 2rem + env(safe-area-inset-bottom)) 1rem}
body[data-view=setup] main{padding-right:1rem}
h2{margin:0 0 .75rem;font:700 .85rem/1.2 var(--head);font-stretch:100%;letter-spacing:.12em;text-transform:uppercase}

.leaf{margin:0 0 1rem;padding:1.15rem 1.15rem 1.3rem 2.4rem}
.leaf.clear{container-type:inline-size} /* the station head fits itself to this width */
@keyframes punch{from{transform:scale(0)}} /* a hole punched through: two frames */
@property --f{syntax:'<number>';inherits:false;initial-value:0} /* read fraction, registered so a band can step forward */

/* navigation: bottom tabs on phones, a rail on the left on wide screens */
.tabs{position:fixed;inset:auto 0 0;z-index:6;display:flex;background:var(--bar);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;min-height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;background:none;border:0;color:var(--bar-dim);font:700 .75rem var(--head);letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
@media(hover:hover){.tabs button:hover{color:var(--bar-ink)}}
.tabs button[aria-current=page]{color:var(--bar-ink)}
.tabs :focus-visible{outline-color:var(--bar-ink);outline-offset:-5px}
.tabs button[aria-current=page]::after{content:'';width:.6rem;height:.6rem;border-radius:50%;background:var(--board);box-shadow:inset 1.5px 1.5px 0 rgba(21,21,21,.5);animation:punch var(--hinge) both} /* selected is a punched hole */
body[data-view=reader] .tabs,body[data-view=setup] .tabs{display:none}

/* the fore-edge thumb index (shared in tokens.css); here each book is a band that fills as it's read */
.rail{bottom:var(--tab)}
body[data-view=reader] .rail{bottom:0}
body[data-view=setup] .rail{display:none}
.rail a{display:flex;flex-direction:column;text-decoration:none;overflow:hidden}
.rail .bk{flex:var(--n) 1 0;min-height:0;border-bottom:1px solid rgba(251,251,246,.35);background:linear-gradient(90deg,rgba(21,21,21,.5) calc(var(--f) * 100%),transparent 0)}
.rail .bk.next{background:linear-gradient(90deg,rgba(21,21,21,.5) calc(var(--f) * 100%),transparent 0),linear-gradient(var(--milk),var(--milk)) right/5px 100% no-repeat}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;min-height:2.75rem;margin-bottom:1rem;color:var(--on-board)}
@media(hover:hover){.mark:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}}
.status{margin:0;padding:.35rem .6rem;border:1.5px solid currentColor;border-radius:2px;font:500 .75rem var(--mono);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.status.late{border-color:var(--errata);background:var(--errata);color:var(--errata-ink)} /* an errata slip */

/* the next chapter, set like a section head on the top ply */
.station{margin:0 0 .6rem;font:800 min(2.6rem,calc(100cqi / (var(--w,7) * .6)))/.95 var(--head);font-stretch:72%;letter-spacing:-.005em;text-transform:uppercase;text-wrap:balance}
.meta{margin:0;color:var(--ink-2)}
.lede{margin:.9rem 0 1.15rem}

.go{display:flex;align-items:center;justify-content:space-between;gap:.75rem;width:100%;min-height:3.25rem;padding:0 1.1rem;border:0;border-radius:2px;background:var(--ink);color:var(--milk);font:700 .95rem var(--head);font-stretch:82%;letter-spacing:.06em;text-transform:uppercase;text-align:left;cursor:pointer}
@media(hover:hover){.go:hover{background:var(--ink-down)}}
.go.ghost{background:none;border:1.5px solid var(--ink);color:var(--ink)}
@media(hover:hover){.go.ghost:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}}

/* today's chapters: a manual's table, read rows punched */
.stops,.route,.route ol{list-style:none;margin:0;padding:0}
.stops li{display:flex;align-items:center;gap:.75rem;min-height:2.75rem;border-top:1px solid var(--rule)}
.stops li:first-child{border-top:0}

/* reading log: a table of days, each filled with the hue of the division it reached */
.log{display:grid;grid-template-columns:auto minmax(0,21rem);justify-content:start;gap:.3rem .5rem}
.wd{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;color:var(--ink-2);font:500 .6875rem/1 var(--mono);align-items:center}
.axis{grid-column:2;display:flex;justify-content:space-between;color:var(--ink-2);font:500 .6875rem var(--mono);text-transform:uppercase}
.cal{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px}
.cal i{aspect-ratio:1;border-radius:1px;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.cal i.on{background:var(--c);box-shadow:inset 0 0 0 1px rgba(21,21,21,.25)}
.facts{display:flex;flex-wrap:wrap;gap:.25rem .9rem;margin:.9rem 0 0;color:var(--ink-2);font:500 .75rem var(--mono);text-transform:uppercase}
.facts span{white-space:nowrap}
@media(max-width:600px){main .facts{flex-direction:column}}

/* index: every chapter, then each division as a coloured divider with its books */
.every{display:flex;flex-wrap:wrap;gap:2px;margin:0 0 .75rem}
.every i{width:3px;height:10px;background:color-mix(in srgb,var(--ink) 10%,transparent)}
.every i.r{background:var(--c);box-shadow:inset 0 -2px 0 rgba(21,21,21,.25)}
.jump{display:flex;flex-wrap:wrap;gap:.4rem;margin:1rem 0 0}
.jchip{display:inline-flex;align-items:center;gap:.45rem;min-height:2.75rem;padding:0 .8rem;border:1.5px solid var(--ink);border-radius:2px;background:var(--leaf);font:700 .75rem var(--head);font-stretch:82%;letter-spacing:.06em;text-transform:uppercase;text-align:left;cursor:pointer}
.jchip b{width:.8rem;height:.8rem;border-radius:2px;background:var(--c)}
@media(hover:hover){.jchip:hover{background:var(--milk)}}
.divider{margin:1.5rem 0 0;padding:.8rem 1rem;border-radius:3px 3px 0 0;background:var(--c);color:var(--o);font:800 1.25rem var(--head);font-stretch:85%;letter-spacing:.04em;text-transform:uppercase;scroll-margin-top:1rem}
.divider+.leaf{border-radius:0 0 3px 3px}
.stn-row>button{display:flex;align-items:center;gap:.75rem;width:100%;min-height:2.75rem;padding:0;border:0;border-top:1px solid var(--rule);background:none;text-align:left;cursor:pointer}
.stn-row:first-child>button{border-top:0}
@media(hover:hover){.stn-row>button:hover .name{text-decoration:underline;text-underline-offset:3px}}
.bar{flex:none;width:3.5rem;height:.55rem;border:1px solid var(--ink);background:linear-gradient(90deg,var(--c) calc(var(--f) * 100%),transparent 0)}
.stn-row.cur .name{font-weight:700}
.name small{display:block;color:var(--ink-2);font:500 .6875rem var(--mono);text-transform:uppercase}
.count{margin-left:auto;white-space:nowrap;color:var(--ink-2);font:500 .8125rem var(--mono);font-variant-numeric:tabular-nums}
.route>li{content-visibility:auto;contain-intrinsic-size:auto 32rem} /* divisions below the screen skip layout until scrolled to */
.book-panel{padding:.25rem 0 .9rem}
/* every chapter of a book as a key you can press: read ones filled in the division's hue, the plan's next one in ink */
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.75rem,1fr));gap:4px;padding:0 0 .8rem}
.chn{min-height:2.75rem;border:1.5px solid var(--ink);border-radius:2px;background:var(--milk);font:500 .8125rem var(--mono);font-variant-numeric:tabular-nums;cursor:pointer}
.chn.r{border-color:transparent;background:var(--c);color:var(--o)}
.chn.nx{border-color:var(--ink);background:var(--ink);color:var(--milk)}
@media(hover:hover){.chn:hover{outline:1.5px solid var(--ink);outline-offset:1px}}
/* go straight to a passage */
.goto{display:flex;gap:.5rem;margin:1rem 0 0}
.goto input{flex:1;min-width:0}
.goto .go{width:auto;min-height:3rem}
/* a verse for today: chosen from a hand-picked list of hope, not at random */
.dvt{margin:.15rem 0 0;max-width:30em;font:400 1.3125rem/1.5 var(--serif);text-wrap:pretty}
/* Indian scripts: taller lines for their marks above and below, and no tracking, which pulls apart joined letters; the phone's own fonts fill in where Garamond has no glyphs */
:is(:lang(hi),:lang(ta),:lang(ml),:lang(te)){--read-lh:1.85;letter-spacing:0}
.dvt:is(:lang(hi),:lang(ta),:lang(ml),:lang(te)){line-height:1.8}
.dvt[aria-busy=true]{color:var(--ink-2)}
.mark-row{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;margin:0}
.go.slim{width:auto;min-height:2.75rem;font-size:.85rem}
.link-btn{min-height:2.75rem;padding:0;border:0;background:none;color:var(--ink-2);font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* forms and setup */
label{display:block;margin:1.25rem 0 .4rem;font:700 .75rem var(--head);letter-spacing:.12em;text-transform:uppercase}
select,input{width:100%;min-height:3rem;padding:0 .8rem;border:1.5px solid var(--ink);border-radius:2px;background:var(--milk);color:var(--ink);font:inherit;caret-color:var(--ink)}
select:focus,input:focus{outline:2.5px solid var(--ink);outline-offset:1px}
.hint{margin:.4rem 0 0;color:var(--ink-2);font-size:.9375rem}
.err{color:var(--errata);font-weight:700}
.picker{margin:0;padding:0;border:0}
.picker legend{padding:0;margin-bottom:.35rem}
.setting{margin-top:1.25rem} /* a legend ignores its own top margin; the fieldset carries the gap */
.lab{margin:0 0 .4rem;font:700 .75rem var(--head);letter-spacing:.12em;text-transform:uppercase}
.inline{display:inline;width:auto;min-height:2.75rem;margin:0 0 0 .25rem;padding:0 .5rem;font:inherit;letter-spacing:0;text-transform:none}
label.inline{margin:0;padding:0;font-weight:400}
.bedset{margin:1rem 0 0}
.bedname{display:flex;align-items:center;gap:.5rem;margin:0 0 .45rem;font:800 .75rem var(--head);letter-spacing:.12em;text-transform:uppercase}
.bedname b{width:.85rem;height:.85rem;border-radius:2px;background:var(--c)}
.bk-pick{margin:0 .35rem .4rem 0;letter-spacing:0;text-transform:none}
@media(hover:hover){.bk-pick:hover{background:color-mix(in srgb,var(--ink) 6%,var(--milk))}}
.preview{margin:0;font-size:1.0625rem}
.preview b{font:800 2rem/1 var(--head);font-stretch:72%;vertical-align:-.1em}
.actions{display:grid;gap:.75rem;margin-top:1rem}
.title{margin:0 0 1rem;color:var(--on-board);font:800 2.2rem/.95 var(--head);font-stretch:72%;text-transform:uppercase}
.danger-zone{margin-top:3rem} /* erase stands apart on its own errata slip, isolated by empty space */
.danger{min-height:2.75rem;padding:0 .9rem;border:0;border-radius:2px;background:var(--milk);color:var(--errata);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.about{color:var(--ink-2);font-size:.9375rem;max-width:42ch;margin:0}

/* reader: a section opener, the chapter's own thumb index laid flat, notes tabbed into the fore edge */
body[data-view=reader] main{padding-top:0}
.rbar{position:sticky;top:0;z-index:4;margin:0 -.5rem .75rem;padding:.5rem .5rem .65rem;background:var(--board) url(board-grain.png);color:var(--on-board)}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.rtools{display:flex;gap:.25rem}
.icon-btn{display:grid;place-items:center;width:2.75rem;height:2.75rem;border:0;border-radius:2px;background:none;color:inherit;cursor:pointer}
@media(hover:hover){.icon-btn:hover{background:color-mix(in srgb,var(--on-board) 12%,transparent)}}
.icon-btn[aria-pressed=true]{background:var(--ink);color:var(--milk)}
.pos{font:500 .75rem var(--mono);text-transform:uppercase}
.vstrip{display:flex;align-items:flex-end;gap:1px;height:1.7rem;margin:-.15rem .5rem -.45rem;padding:.45rem 0;cursor:pointer;touch-action:none;user-select:none} /* tap a verse's bar, or drag along them, and the text follows */
.vstrip i{flex:1 1 0;min-width:0;height:.45rem;background:color-mix(in srgb,var(--on-board) 22%,transparent)}
.vstrip i.on{background:var(--on-board)}
.vstrip i.t{height:.8rem} /* a verse with a tabbed note stands taller */
.opener .station{margin:0 0 .35rem}
.sec{display:flex;align-items:flex-end;gap:.9rem}
.num{flex:none;font:800 5.5rem/.76 var(--head);font-stretch:72%;letter-spacing:-.02em}
.sec .meta{line-height:1.5}
.sum{margin:1rem 0 0;color:var(--ink-2);text-wrap:pretty}
.scripture{--lane-l:2.4rem;--lane-r:2.6rem;--poke:.65rem;--tab-w:2.25rem;padding-left:var(--lane-l);padding-right:var(--lane-r);background:var(--plate);color:var(--plate-ink);font:400 var(--read) var(--serif);line-height:calc(var(--read-lh) + var(--lh-night))}
.para{max-width:30em;text-wrap:pretty}
.para+.para{margin-top:.8em}
.scripture sup{position:relative;top:-.5em;margin-right:.18em;vertical-align:baseline;color:var(--plate-dim);font:500 .58em/0 var(--mono)} /* raised without stretching the line */
.vs{transition:background var(--hinge)}
.vs.now,.vs.open{background:color-mix(in srgb,var(--hue) 30%,transparent);box-decoration-break:clone;-webkit-box-decoration-break:clone}
/* a note's tab sticks out of the page's fore edge at the line where its verse starts */
.tab{position:relative;float:right;clear:right;display:grid;place-items:center;width:var(--tab-w);height:2rem;margin:.1em calc(-1 * (var(--lane-r) + var(--poke))) .3rem .5rem;padding:0 0 0 .15rem;border:0;border-radius:0 4px 4px 0;background:var(--plate-ink);color:var(--plate);cursor:pointer}
.tab .ic{width:1rem;height:1rem}
@media(hover:hover){.tab:hover{translate:2px 0}}
.tab[aria-expanded=true] .ic{display:none}
.tab[aria-expanded=true]::before{content:'';width:.6rem;height:.6rem;border-radius:50%;background:var(--board);box-shadow:inset 1.5px 1.5px 0 rgba(21,21,21,.5)} /* pulled: punched */
.pull{margin:.7rem 0 .9rem;padding:.85rem .95rem 1rem;border-radius:2px;background:var(--milk);color:var(--ink);box-shadow:3px 3px 0 rgba(21,21,21,.24);font:400 1rem/1.5 var(--sans);transform-origin:50% 0}
.pull p{margin:.35rem 0 0;text-wrap:pretty}
.pull .refs{flex-direction:column;align-items:flex-start;gap:.4rem}
.pull .nhead{display:flex;flex-direction:column;align-items:flex-start;gap:.5rem}
.pull .kind{order:-1;margin-top:-.85rem;border-radius:0 0 2px 2px} /* the note's kind hangs from the card's top edge like a tab */
.skel i{display:block;height:.9rem;margin:.7rem 0;border-radius:1px;background:color-mix(in srgb,var(--plate-ink) 12%,transparent);animation:wait 1s steps(2,jump-none) infinite}
.skel i:nth-child(3n){width:68%}
@keyframes wait{50%{opacity:.45}}
.scripture .link{padding:0;border:0;background:none;color:inherit;font-weight:500;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.credit{margin:-.5rem 0 1.25rem;color:var(--on-board);font:500 .6875rem var(--mono);text-transform:uppercase}
/* fill the gap: recall from the chapter just read */
.gap{margin:0;font:400 var(--read) var(--serif);line-height:calc(var(--read-lh) + var(--lh-night));text-wrap:pretty}
.blank{display:inline-block;min-width:5.5em;height:1.1em;border-bottom:2px solid var(--ink);vertical-align:-.15em}
.blank.filled{min-width:0;height:auto;padding:0 .15em;border-bottom-color:transparent;background:color-mix(in srgb,var(--hue) 35%,transparent);font-weight:500;vertical-align:baseline}
.opts{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0 0}
.opt{display:inline-flex;align-items:center;gap:.5rem;min-height:2.75rem;padding:0 1rem;border:1.5px solid var(--ink);border-radius:2px;background:var(--milk);font:500 1rem var(--sans);cursor:pointer}
@media(hover:hover){.opt:hover:enabled{background:color-mix(in srgb,var(--ink) 6%,var(--milk))}}
.opt:disabled{cursor:default;color:var(--ink-2);border-color:var(--ink-2)}
.opt.right{border-color:var(--ink);background:var(--ink);color:var(--milk)}
.opt.right::before{content:'';width:.6rem;height:.6rem;border-radius:50%;background:var(--board);box-shadow:inset 1.5px 1.5px 0 rgba(21,21,21,.5);animation:punch var(--hinge) both}
.opt.wrong{border-color:var(--errata);background:var(--errata);color:var(--errata-ink);animation:jolt var(--hinge) both} /* an errata slip, struck slightly out of register */
@keyframes jolt{from{translate:-5px 0}}
.blank.filled{animation:inkin var(--hinge) both}
@keyframes inkin{from{clip-path:inset(0 100% 0 0)}} /* the answer prints in, left half then right */
.said{margin:.75rem 0 0;min-height:1.4em}
.go.punched .ic{display:none}
.go.punched::after{content:'';width:.75rem;height:.75rem;margin-right:.25rem;border-radius:50%;background:var(--board);box-shadow:inset 1.5px 1.5px 0 rgba(0,0,0,.6);animation:punch var(--hinge) both} /* Done is punched before the page turns */
.said:focus{outline:none}
/* before the text: what to look for, and the book's introduction when you start a book */
.look{margin:.9rem 0 0;text-wrap:pretty}
.look .kind,.skim .kind{margin-right:.4rem;vertical-align:.12em}
.intro summary{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:2.75rem;margin:-.4rem 0;font:700 .85rem var(--head);letter-spacing:.12em;text-transform:uppercase;list-style:none;cursor:pointer}
.intro summary::-webkit-details-marker{display:none}
.intro summary::after{content:'';flex:none;width:.55rem;height:.55rem;border-right:2px solid;border-bottom:2px solid;rotate:45deg;translate:0 -.15rem}
.intro details[open] summary::after{rotate:-135deg;translate:0 .15rem}
.intro dt{margin:1rem 0 .2rem;font:700 .75rem var(--head);letter-spacing:.12em;text-transform:uppercase}
.intro dd{margin:0;max-width:34em;text-wrap:pretty}
.intro h3{margin:1.25rem 0 .25rem;font:700 .75rem var(--head);letter-spacing:.12em;text-transform:uppercase}
.intro .refs{margin:.75rem 0 0}
/* while reading: a skim guide for list-heavy chapters, key verses marked, names you can tap */
.skim{margin:0 0 1.1rem;padding:0 0 .9rem;border-bottom:1px solid color-mix(in srgb,var(--plate-ink) 18%,transparent);font:400 1rem/1.5 var(--sans);max-width:34em}
.kv,.scripture .vs.key>sup{padding:.05em .3em;border-radius:1px;background:var(--plate-ink);color:var(--plate)}
.kv{font:500 .8em var(--mono)}
.who{padding:0;border:0;background:none;color:inherit;font:inherit;text-decoration:underline dotted 1.5px;text-decoration-color:var(--plate-dim);text-underline-offset:.2em;cursor:pointer}
@media(hover:hover){.who:hover{text-decoration-style:solid}}
/* a name's card rises from the bottom edge, where a thumb can reach it */
.gloss{inset:auto 0 0;width:auto;max-width:34rem;margin:0 auto;padding:1.15rem 1.15rem calc(1.2rem + env(safe-area-inset-bottom)) 2.4rem;border:0;border-radius:3px 3px 0 0;background:var(--milk);color:var(--ink);box-shadow:0 -3px 0 rgba(21,21,21,.24);font:400 1rem/1.5 var(--sans)}
.gloss::before{content:'';position:absolute;left:.75rem;top:1.05rem;width:.75rem;height:.75rem;border-radius:50%;background:var(--board);box-shadow:inset 1.5px 1.5px 0 rgba(21,21,21,.35)}
.gloss,.gloss::backdrop{transition:translate var(--hinge),background-color var(--hinge),overlay var(--hinge) allow-discrete,display var(--hinge) allow-discrete}
.gloss{translate:0 100%}.gloss:popover-open{translate:0} /* it leaves the way it came: down past the bottom edge */
@starting-style{.gloss:popover-open{translate:0 100%}.gloss:popover-open::backdrop{background:rgba(21,21,21,0)}}
.gloss::backdrop{background:rgba(21,21,21,0)}.gloss:popover-open::backdrop{background:rgba(21,21,21,.35)}
.gloss p{margin:0;max-width:34em}
.gloss .gk{color:var(--ink-2);font:500 .75rem var(--mono);letter-spacing:.04em;text-transform:uppercase}
.gloss .gname{margin:.2rem 0 .4rem;font:800 1.6rem/1 var(--head);font-stretch:72%;text-transform:uppercase}
.gloss .go{margin-top:1rem}

.notes li{padding:.85rem 0 1rem;border-top:1px solid var(--rule)}
.notes li:first-child{border-top:0;padding-top:0}
.notes p{margin:.35rem 0 0;line-height:1.5;max-width:31em}
.refs{display:flex;align-items:baseline;gap:.6rem}

.refs>span{flex:none;color:var(--ink-2);font:500 .6875rem var(--mono);text-transform:uppercase}

:is(button,a,summary,.bk-pick):active{translate:1px 1px}
.tab:active{translate:2px 0}
.empty{margin:0;padding:.9rem 1rem;border:1.5px dashed var(--ink-2);border-radius:2px;color:var(--ink-2)}

@media(max-width:599px){

@media(min-width:1200px){

function introHTML(x,b,c){ // who wrote the book, when, why, and its shape, with the part this chapter sits in marked
  const here=r=>{const [a,z=a]=r.split(/[–-]/).map(Number);return c>=a&&c<=z},rb=bookOf(x.verse);
  return `<summary>About ${b}</summary>
    <dl><dt>Who wrote it</dt><dd>${esc(x.who)}</dd><dt>When</dt><dd>${esc(x.when)}</dd><dt>Why it was written</dt><dd>${esc(x.why)}</dd></dl>
    <h3>The shape of ${b}</h3><ol class=stops>${x.outline.map(p=>`<li${here(p.chapters)?' class=next':''}><span class=mk aria-hidden=true></span><span class=stn>${esc(p.title)}</span><span class=tag>${here(p.chapters)?'You are here · ':''}${esc(p.chapters)}</span></li>`).join('')}</ol>
    ${x.verse?`<p class=refs><span>Key verse</span><i><button class=ref aria-expanded=false data-r="${esc(x.verse)}" onclick=ref(this) style="--c:var(--${rb<0?'edge':bed(rb)[0]})"><b aria-hidden=true></b>${esc(x.verse)}</button></i></p>`:''}`;
}
const anchor=(body,c)=>+(body.match(new RegExp(`\\(${c}:(\\d+)`))||body.match(/\b[Vv]erse (\d+)/)||[])[1]||0;
const noteHTML=x=>{const [name,ic]=KINDS[x.kind]||['Note','why'];
  return `<div class=nhead><h3>${esc(x.title)}</h3><span class=kind>${icon(ic)}${name}</span></div><p>${esc(x.body)}</p>
    ${x.refs.length?`<p class=refs><span>See also</span><i>${x.refs.map(r=>{const rb=bookOf(r);
      return `<button class=ref aria-expanded=false data-r="${esc(r)}" onclick=ref(this) style="--c:var(--${rb<0?'edge':bed(rb)[0]})"><b aria-hidden=true></b>${esc(r)}</button>`}).join('')}</i></p>`:''}`};
function notesHTML(list){
  const k=days('2000-01-01',today())%list.length; // rotate daily so a revisit opens on a different note
  return `<h2>Why &amp; How</h2><ol class=notes>${[...list.slice(k),...list.slice(0,k)].map(x=>`<li>${noteHTML(x)}</li>`).join('')}</ol>`;
}
function scriptureHTML(verses,list,at,x,kept=new Set()){ // verses as paragraphs (a new one where a speech opens); notes ride the fore edge as tabs at their verse
  let h='',n=0;
  const key=x?.skim?.advice?x.skim.key:[],names=(x?.names||[]).map(m=>({...m,re:new RegExp(`\\b${m.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b`)})),found=[];
  for(const v of verses){
    const t=v.text.replace(/\s+/g,' ').trim();
    if(n>1&&/^[“‘"]/.test(t)){h+='</div><div class=para>';n=0}
    n++;
    const tabs=list.map((x,j)=>{if(at[j]!==v.verse)return '';const [name,ic]=KINDS[x.kind]||['Note','why'];
      return `<button class=tab aria-expanded=false aria-label="${name} note on verse ${v.verse}: ${esc(x.title)}" onclick="pull(this,${j})">${icon(ic)}</button>`}).join('');
    let text=esc(t);
    for(const m of names)if(!found.includes(m)&&m.re.test(text)){ // a name becomes tappable where it first appears
      text=text.replace(m.re,w=>`<button class=who popovertarget=who-${found.length}>${w}</button>`);found.push(m)}
    h+=`<span class="vs${key.includes(v.verse)?' key':''}${kept.has(v.verse)?' kept':''}" data-v=${v.verse} data-t="${esc(t)}">${tabs}<sup>${v.verse}</sup>${text} </span>`;
  }
  const skim=key.length?`<p class=skim><span class=kind>${icon('bigpicture')}Skim guide</span>${esc(x.skim.advice)} Key verses: ${key.map(k=>`<span class=kv>${k}</span>`).join(' ')}.</p>`:'';
  return `${skim}<div class=para>${h}</div>${found.map((m,i)=>`<div popover id=who-${i} class=gloss role=dialog aria-label="${esc(m.name)}">
    <p class=gk>${esc(m.kind)}</p><p class=gname>${esc(m.name)}</p><p>${esc(m.gloss)}</p>
    <button class="go ghost slim" popovertarget=who-${i} popovertargetaction=hide autofocus>Back to the text</button></div>`).join('')}`;
}
function pull(btn,j){ // pulling a tab brings its note out under the verse it explains; pull again to put it back
  const vs=btn.closest('.vs'),open=btn.ariaExpanded==='true';
  btn.ariaExpanded=!open;
  if(open)document.getElementById('pull-'+j)?.remove();
  else{vs.insertAdjacentHTML('afterend',`<div class=pull id=pull-${j}>${noteHTML(NOTES[j])}</div>`);
    step([vs.nextElementSibling],'perspective(900px) rotateX(-24deg)','50% 0')}
  vs.classList.toggle('open',!!vs.querySelector('.tab[aria-expanded=true]'));
  track();
}
function track(){ // the verse strip fills, one hard step per verse, as each verse passes the reading line; its value is the verse at the top
  const vs=$.querySelectorAll('.vs'),cells=$.querySelectorAll('.vstrip i'),st=$.querySelector('.vstrip');if(!vs.length)return;
  const above=y=>{let lo=0,hi=vs.length;while(lo<hi){const m=lo+hi>>1;vs[m].getBoundingClientRect().top<y?lo=m+1:hi=m}return lo}; // verses starting above y
  const n=scrollY+innerHeight>=document.documentElement.scrollHeight-8?vs.length:above(innerHeight*.4),top=Math.max(above($.querySelector('.rbar').getBoundingClientRect().bottom+16),1);
  cells.forEach((c,k)=>c.classList.toggle('on',k<n));st.ariaValueNow=top;st.ariaValueText=`Verse ${top} of ${vs.length}`;
}
// fill the gap: the rarest long word of one verse, against two others from the same chapter
const STOP=new Set('should before therefore against because people children himself themselves through without another according whosoever whatever whether either neither between within around behold thereof wherefore unless toward towards became become always nothing something anyone everyone things saying answered'.split(' '));
const hsh=s=>[...s].reduce((a,ch)=>(a*31+ch.charCodeAt(0))>>>0,7);
function recallHTML(verses,key){
  const words=t=>t.match(/[A-Za-z]+/g)||[],lc=w=>w.toLowerCase(),freq={};
  for(const v of verses)for(const w of words(v.text))freq[lc(w)]=(freq[lc(w)]||0)+1;
  const pool=verses.map(v=>({v,ws:[...new Set(words(v.text))].filter(w=>w.length>=6&&!STOP.has(lc(w))).sort((a,b)=>freq[lc(a)]-freq[lc(b)]||b.length-a.length)})).filter(x=>x.ws.length);
  if(pool.length<3)return '';
  const q=pool[hsh(key)%pool.length],ans=q.ws[0],cap=w=>w[0]!==lc(w[0]),inQ=new Set(words(q.v.text).map(lc));
  const others=[...new Set(pool.filter(x=>x!==q).flatMap(x=>x.ws))].filter(w=>!inQ.has(lc(w)))
    .sort((a,b)=>(cap(a)!==cap(ans))-(cap(b)!==cap(ans))||Math.abs(a.length-ans.length)-Math.abs(b.length-ans.length));
  if(others.length<2)return '';
  const opts=[ans,others[0],others[1]].sort((a,b)=>hsh(a+key)-hsh(b+key)),t=esc(q.v.text.replace(/\s+/g,' ').trim());
  const gap=t.replace(new RegExp(`\\b${ans}\\b`),'<span class=blank><span class=sr>blank</span></span>');
  return `<h2 id=rc-h>Fill the gap</h2><p class=gap>${gap}</p>
    <div class=opts role=group aria-label="Choose the missing word" data-a="${ans}" data-r="${key}:${q.v.verse}">${opts.map(w=>`<button class=opt onclick=pick(this)>${w}</button>`).join('')}</div>
    <p class="said mono" aria-live=polite tabindex=-1></p>`;
}
function pick(btn){
  const box=btn.parentNode,ans=box.dataset.a,ok=btn.textContent===ans,blank=$.querySelector('.blank'),said=$.querySelector('.said');
  for(const o of box.children){o.disabled=true;if(o.textContent===ans)o.classList.add('right')}
  if(!ok)btn.classList.add('wrong'); // a wrong pick is an erratum
  navigator.vibrate?.(ok?12:[30,50,30]);
  blank.textContent=ans;blank.classList.add('filled');
  said.textContent=ok?`Right. ${box.dataset.r}`:`It's "${ans}". ${box.dataset.r}`;said.focus();
}
async function ref(btn){ // tap a reference to show that passage under the note; tap again to hide
  if(btn.q){btn.q.remove();btn.q=null;btn.setAttribute('aria-expanded',false);return}
  const q=btn.q=document.createElement('blockquote');q.textContent='Loading…';btn.closest('.refs').after(q);btn.setAttribute('aria-expanded',true);step([q],'perspective(900px) rotateX(-20deg)','50% 0');
  try{q.textContent=`${btn.dataset.r}: ${(await passage(btn.dataset.r)).text.replace(/\s+/g,' ').trim()}`}
  catch{q.textContent=`Couldn't load ${btn.dataset.r}. Check your connection and tap the reference again.`}
}
function listen(btn){ // one utterance per verse, so the current verse can be highlighted
  const stopped=()=>{wake?.release();wake=null;$.querySelector('.now')?.classList.remove('now');btn.setAttribute('aria-pressed',false);btn.innerHTML=icon('listen');btn.ariaLabel='Listen to this chapter'};
  if(speechSynthesis.speaking){hush();return stopped()}
  const vs=[...$.querySelectorAll('.vs')];
  if(!vs.length)return;
  vs.forEach((s,i)=>{
    const u=new SpeechSynthesisUtterance(s.dataset.t);u.lang=TR[S.tr][1];u.rate=S.rate;
    u.onstart=()=>{$.querySelector('.now')?.classList.remove('now');s.classList.add('now');s.scrollIntoView({block:'center'})};
    if(i==vs.length-1)u.onend=stopped;
    speechSynthesis.speak(u)});
  navigator.wakeLock?.request('screen').then(l=>wake=l,()=>{});
  btn.setAttribute('aria-pressed',true);btn.innerHTML=icon('stop');btn.ariaLabel='Stop listening';
}
function finish(btn){
  if(turning)return;
  const d=today(),i=cur(),bi=CH[i][2];
  if(isRead(i))return go('today'); // a chapter read before: nothing new to record
  stepped={bi,from:readIn(bi)/BOOKS[bi][1]};
  setRead(i,true);S.log[d]=(S.log[d]||0)+1;S.at[d]=i;
  if(S.day?.d!==d)S.day={d,idx:[]};S.day.idx.push(i);save();
  const n=nextIn(S.read,i+1);at=n<CH.length?n:null; // carry on from here: the next unread chapter after this one
  const next=at!=null&&S.log[d]<goal()?'reader':'today'; // keep reading until today's goal is met
  navigator.vibrate?.(12);btn?.classList.add('punched');$.querySelectorAll('.vstrip i').forEach(c=>c.classList.add('on'));
  const shut=step($.querySelectorAll('.opener,.scripture'),'perspective(900px) rotateY(-75deg)','0 50%',true); // the leaves hinge shut at the punched edge
  if(!shut.length)return go(next);
  turning=true;Promise.all(shut.map(a=>a.finished)).finally(()=>{turning=false;if(view==='reader')go(next)}); // a tab tapped mid-turn wins
}

let installEvt; // Android Chrome: offer our own install button in Settings
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(view==='settings')render()});
function install(){installEvt.prompt();installEvt=null;document.getElementById('inst')?.remove()}
navigator.serviceWorker?.register('sw.js');
render();sync();
</script>
