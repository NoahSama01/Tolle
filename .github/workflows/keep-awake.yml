# Once a day, make one small database request so the free Supabase project never sits idle
# long enough to pause (it pauses after 7 quiet days). The URL and key are public by design.
name: Keep the backend awake

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily, 08:47 in India
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: >
          curl --fail --silent --show-error -X POST
          "https://wvzfjqblglbtyjcnklym.supabase.co/rest/v1/rpc/ping"
          -H "apikey: sb_publishable_5e2eMODJEOTuvJmaWo70ZQ_IgQLb00L"
          -H "Content-Type: application/json" -d "{}"
